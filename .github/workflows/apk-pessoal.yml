# Compila o APK pessoal do Francisco a cada alteração em main (ou à mão, no separador Actions).
#
# Usa o flavor "play": sem o atualizador automático, que iria buscar as versões oficiais do
# openGym e tentar instalá-las por cima desta. O applicationId tem o sufixo ".francisco"
# (app/build.gradle), por isso esta app vive lado a lado com a oficial, se estiver instalada.
#
# Assinatura: precisa de dois segredos (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_B64       a keystore em base64
#   KEYSTORE_PASSWORD  a password da keystore (e da chave, alias "pessoal")
# Guardar sempre a mesma keystore: o Android só aceita atualizações assinadas com a mesma chave.
name: APK pessoal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar a app web e copiar para o Android
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      - name: Compilar o APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemblePlayRelease

      - name: Assinar o APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Falta o segredo KEYSTORE_B64 (ver o topo deste ficheiro)."
            exit 1
          fi
          VER="$(node -p "require('./frontend/package.json').version")"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=frontend/android/app/build/outputs/apk/play/release/app-play-release-unsigned.apk
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/ks.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias pessoal \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "openGym-pessoal-$VER-${GITHUB_SHA::7}.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/ks.jks"
          "$BT/apksigner" verify "openGym-pessoal-$VER-${GITHUB_SHA::7}.apk"
          sha256sum openGym-pessoal-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-pessoal
          path: openGym-pessoal-*.apk
          retention-days: 30
