# Compila o APK pessoal do Francisco a cada alteração em main (ou à mão, no separador Actions)
# e publica-o como Release do repositório, para descarregar diretamente no telemóvel.
#
# Usa o flavor "play": sem o atualizador automático, que iria buscar as versões oficiais do
# openGym e tentar instalá-las por cima desta. O applicationId tem o sufixo ".francisco"
# (app/build.gradle), por isso esta app vive lado a lado com a oficial, se estiver instalada.
#
# Assinatura: a keystore está cifrada em frontend/android/signing/opengym-pessoal.jks.enc
# (AES-256, PBKDF2). Precisa de um segredo (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_PASSWORD  decifra a keystore e é também a password dela (alias "pessoal")
# Nunca mudar esta keystore: o Android só aceita atualizações assinadas com a mesma chave.
name: APK pessoal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verificar o segredo da assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Falta o segredo KEYSTORE_PASSWORD (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Compilar a app web e copiar para o Android
        working-directory: frontend
        run: |
          npm ci
          npm run build:mobile

      - name: Compilar o APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assemblePlayRelease

      - name: Assinar o APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eu
          VER="$(node -p "require('./frontend/package.json').version")"
          NAME="openGym-pessoal-$VER-build$GITHUB_RUN_NUMBER.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=frontend/android/app/build/outputs/apk/play/release/app-play-release-unsigned.apk
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/pw"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in frontend/android/signing/opengym-pessoal.jks.enc \
            -out "$RUNNER_TEMP/ks.jks" -pass file:"$RUNNER_TEMP/pw"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/ks.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias pessoal \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$NAME" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/ks.jks" "$RUNNER_TEMP/pw"
          "$BT/apksigner" verify "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="build-$GITHUB_RUN_NUMBER"
          MSG="$(git log -1 --format=%s "$GITHUB_SHA")"
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --target "$GITHUB_SHA" \
            --title "Build $GITHUB_RUN_NUMBER" \
            --notes "Alteração: $MSG" \
            --latest
